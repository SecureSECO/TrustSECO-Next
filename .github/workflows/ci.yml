name: TrustSECO checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  coordinator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/coordinator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx tsc
      - run: node --test test/measurements.cjs test/score-inputs.cjs
      - run: node --test test/pilot-setup.cjs test/pilot-portal.cjs
      - run: node --test ../../tools/pilot/client.test.cjs
      - run: node --test ../../tools/pilot/local-identity.test.cjs ../../tools/pilot/credentials.test.cjs ../../tools/pilot/libraries.test.cjs
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
        env:
          VITE_HOST: localhost:3002
          VITE_PROTOCOL: http
      - run: npm run build
        env:
          VITE_PILOT: 'true'
          VITE_HOST: localhost:3005
          VITE_PROTOCOL: http
  ledger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand
      - run: node test/gpg-registration.cjs
      - run: node test/score-subsets.cjs
      - run: node test/seed-peers.cjs
      - run: node test/community.cjs
      - run: node test/community-storage.cjs
      - run: node test/payouts.cjs
      - run: node --test test/pilot.cjs
  spider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/spider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r dev_requirements.txt
      - run: python -m pytest tests/unit_tests -q
