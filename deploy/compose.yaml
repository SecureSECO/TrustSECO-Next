name: trustseco-next
services:
  web:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        PORTAL_HOST: localhost:${TRUSTSECO_PORT:-3002}
    ports: ["127.0.0.1:${TRUSTSECO_PORT:-3002}:3000"]
    env_file: ../.env
    environment:
      SERVER_TYPE: PRIVATE
      ENABLE_SPIDER: "true"
      ENABLE_AUTO_CRAWLER: "false"
    volumes:
      - measurements:/usr/app/data
      - keys:/root/.gnupg
    depends_on:
      dlt:
        condition: service_healthy
      spider:
        condition: service_started
  dlt:
    platform: linux/amd64
    environment:
      TRUSTSECO_NETWORK: ${TRUSTSECO_NETWORK:-local}
      TRUSTSECO_NODE_ADDRESS: ${TRUSTSECO_NODE_ADDRESS:-}
      TRUSTSECO_SEED_PEERS: ${TRUSTSECO_SEED_PEERS:-}
    build: ../services/ledger
    command: ["sh", "-c", "if [ -f /root/.klayr/validator-config.json ]; then npm run build && ./bin/run start --config /root/.klayr/validator-config.json; else npm run start; fi"]
    volumes:
      - ledger:/root/.klayr
      - keys:/root/.gnupg
    healthcheck:
      test: ["CMD", "node", "-e", "require('@klayr/api-client').createWSClient('ws://127.0.0.1:7887/rpc-ws').then(async c=>{await c.invoke('system_getNodeInfo');await c.disconnect();process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 60
  spider:
    build: ../services/spider
volumes:
  measurements:
  keys:
  ledger:
