name: trustseco-uu1
x-worker: &worker
  image: ${LEDGER_IMAGE:?Immutable ledger image ID required}
  platform: linux/amd64
  init: true
  restart: unless-stopped
  network_mode: service:web
  environment: {NODE_OPTIONS: '--max-old-space-size=96', CLAMAV_HOST: clamav}
  mem_limit: 224m
  logging: {driver: json-file, options: {max-size: '10m', max-file: '3'}}
services:
  ledger:
    image: ${LEDGER_IMAGE:?Immutable ledger image ID required}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    command: ['./bin/run', start, --config, /pilot/config.json, --overwrite-config]
    environment:
      TRUSTSECO_PILOT: 'true'
      PILOT_NETWORK: trustseco-8b7bb864
      PILOT_GOVERNOR_FILE: /pilot/governor.pem
      TRUSTSECO_NODE_ADDRESS: trustseco1.science.uu.nl:8000
      TRUSTSECO_WEB_URL: https://trustseco1.science.uu.nl/
      NODE_OPTIONS: --max-old-space-size=384
    ports: ['8000:8000']
    volumes: ['./ledger:/root/.klayr', './public:/pilot:ro', './validator:/validator:ro']
    mem_limit: 768m
    logging: {driver: json-file, options: {max-size: '10m', max-file: '3'}}
  web:
    image: ${WEB_IMAGE:?Immutable web image ID required}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    command: [node, dist/pilot.js]
    environment:
      DLT_ENDPOINT: ws://ledger:7887/rpc-ws
      PILOT_RELAYER_FILE: /relayer/relayer.json
      PILOT_TEST_NETWORK: 'true'
      PILOT_NETWORK: trustseco-8b7bb864
      PILOT_AUTO_ADMISSION: 'true'
      PILOT_REQUEST_DIR: /requests
      PILOT_PUBLIC_NETWORK_DIR: /pilot
      PILOT_PUBLIC_PEERS: trustseco1.science.uu.nl:8000
      PILOT_PACKAGE_QUEUE_FILE: /queue/packages.json
      NODE_OPTIONS: --max-old-space-size=256
    volumes: ['./public:/pilot:ro', './relayer:/relayer:ro', './requests:/requests', './queue:/queue']
    ports: ['127.0.0.1:3000:3000']
    mem_limit: 512m
    logging: {driver: json-file, options: {max-size: '10m', max-file: '3'}}
  https:
    image: caddy@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    environment: {PUBLIC_HOST: trustseco1.science.uu.nl, ACME_EMAIL: slinger@slingerjansen.nl}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', './caddy-data:/data', './caddy-config:/config', './reviewer-download:/srv/reviewer:ro']
    mem_limit: 128m
    logging: {driver: json-file, options: {max-size: '10m', max-file: '3'}}
  admission:
    <<: *worker
    command: [node, /tools/auto-admission.cjs, 'http://localhost:3000', /requests, /governor/identity.json]
    environment: {NODE_OPTIONS: '--max-old-space-size=96', NODE_PATH: /usr/src/app/node_modules, PILOT_ADMISSION_CREDENTIALS_FILE: /credentials/credentials.json}
    volumes: ['./requests:/requests', './governor-admission:/governor', './credentials:/credentials:ro']
  publisher:
    <<: *worker
    command: [node, /tools/package-queue.cjs, 'http://localhost:3000', /queue/packages.json, /governor/identity.json]
    volumes: ['./queue:/queue:ro', './governor-publisher:/governor']
  worker-a:
    <<: *worker
    image: ${WORKER_IMAGE:-${LEDGER_IMAGE}}
    command: [node, /tools/local-test-miner.cjs, 'http://localhost:3000', /identity/identity.json, /credentials/credentials.json]
    environment: {NODE_OPTIONS: '--max-old-space-size=96', CLAMAV_HOST: clamav, LIBRARIES_REQUEST_STATE_DIR: /provider-state}
    volumes: ['./provider-state:/provider-state', './contributors/test-a:/identity', './credentials:/credentials:ro']
  worker-b:
    <<: *worker
    image: ${WORKER_IMAGE:-${LEDGER_IMAGE}}
    command: [node, /tools/local-test-miner.cjs, 'http://localhost:3000', /identity/identity.json, /credentials/credentials.json]
    environment: {NODE_OPTIONS: '--max-old-space-size=96', CLAMAV_HOST: clamav, LIBRARIES_REQUEST_STATE_DIR: /provider-state}
    volumes: ['./provider-state:/provider-state', './contributors/test-b:/identity', './credentials:/credentials:ro']
  worker-c:
    <<: *worker
    image: ${WORKER_IMAGE:-${LEDGER_IMAGE}}
    command: [node, /tools/local-test-miner.cjs, 'http://localhost:3000', /identity/identity.json, /credentials/credentials.json]
    environment: {NODE_OPTIONS: '--max-old-space-size=96', CLAMAV_HOST: clamav, LIBRARIES_REQUEST_STATE_DIR: /provider-state}
    volumes: ['./provider-state:/provider-state', './contributors/test-c:/identity', './credentials:/credentials:ro']
  clamav:
    image: clamav/clamav@sha256:1fdfd24c6f0a0fb60788481487459a6d4eda8a9b448641594e04db8410d34422
    restart: unless-stopped
    init: true
    mem_limit: 1400m
    cpus: 0.5
    volumes: ['./clamav-signatures:/var/lib/clamav', './clamd.conf:/etc/clamav/clamd.conf:ro']
    healthcheck:
      test: [CMD-SHELL, 'test "$$(printf "PING\\n" | nc -w 2 127.0.0.1 3310)" = PONG']
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 3m
    logging: {driver: json-file, options: {max-size: '10m', max-file: '3'}}
